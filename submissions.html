<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="style.css" />
    <title>Submission History - House Points Tracker</title>
  </head>
  <body>
    <nav class="nav-container">
      <button class="menu-button" aria-label="Toggle menu">☰</button>
      <div class="nav-links">
        <a href="index.html" class="nav-button">Home</a>
        <a href="submit.html" class="nav-button">Submit Points</a>
        <a href="standings.html" class="nav-button">Standings</a>
        <a href="submissions.html" class="nav-button">Submissions</a>
      </div>
    </nav>

    <div class="container">
      <h1>Submission History</h1>
      <div class="table-wrap">
        <table id="submissionsTable">
          <thead>
            <tr>
              <th>Timestamp</th>
              <th>House</th>
              <th>Student Name</th>
              <th>Points</th>
              <th>Teacher</th>
              <th>Reason</th>
              <th>Admin</th>
            </tr>
          </thead>
          <tbody id="submissionsBody">
            <!-- Filled dynamically -->
          </tbody>
        </table>
      </div>
      <div id="mobileSubmissionsList">
        <!-- Filled dynamically for mobile -->
      </div>
    </div>

    <script src="config.js"></script>
    <script src="script.js"></script>
    <script>
      async function deleteSubmission(id) {
        const pin = prompt("Enter admin PIN to delete this submission:");
        if (!pin) return;

        const apiBase =
          (window.HOUSE_POINTS_CONFIG &&
            window.HOUSE_POINTS_CONFIG.API_BASE_URL) ||
          window.location.origin;

        try {
          const res = await fetch(`${apiBase}/api/submissions/${id}`, {
            method: "DELETE",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ pin }),
          });
          const data = await res.json();
          if (!res.ok) {
            alert(data.error || "Failed to delete submission");
            return;
          }
          document.getElementById(`row-${id}`).remove();
        } catch (err) {
          alert("Unable to connect to server");
        }
      }
    </script>
  </body>
</html>
