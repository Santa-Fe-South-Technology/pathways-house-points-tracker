<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="style.css" />
    <title>Submission History - House Points Tracker</title>
  </head>
  <body>
    <nav class="nav-container">
      <button class="menu-button" aria-label="Toggle menu">☰</button>
      <div class="nav-links">
        <a href="index.html" class="nav-button">Home</a>
        <a href="submit.html" class="nav-button">Submit Points</a>
        <a href="standings.html" class="nav-button">Standings</a>
        <a href="submissions.html" class="nav-button">Submissions</a>
      </div>
    </nav>

    <div class="container">
      <h1>Submission History</h1>
      <table id="submissionsTable">
        <thead>
          <tr>
            <th>Timestamp</th>
            <th>House</th>
            <th>Student Name</th>
            <th>Points</th>
            <th>Teacher</th>
            <th>Reason</th>
          </tr>
        </thead>
        <tbody id="submissionsBody">
          <!-- Filled dynamically -->
        </tbody>
      </table>
    </div>

    <script src="script.js"></script>
    <script>
      // Fetch submissions from Vercel API and populate table
      async function fetchSubmissions() {
        try {
          const res = await fetch(
            "https://next-js-api-silk.vercel.app/api/data?type=submissions"
          );
          const submissions = await res.json();

          const tbody = document.getElementById("submissionsBody");
          tbody.innerHTML = "";

          submissions.forEach((sub) => {
            const tr = document.createElement("tr");
            tr.innerHTML = `
              <td>${new Date(sub.created_at).toLocaleString()}</td>
              <td>${sub.house}</td>
              <td>${sub.student_name}</td>
              <td>${sub.points}</td>
              <td>${sub.teacher}</td>
              <td>${sub.reason}</td>
            `;
            tbody.appendChild(tr);
          });
        } catch (err) {
          console.error("Failed to fetch submissions:", err);
          const tbody = document.getElementById("submissionsBody");
          tbody.innerHTML = `<tr><td colspan="6">Failed to load submissions</td></tr>`;
        }
      }

      if (document.getElementById("submissionsBody")) {
        fetchSubmissions();
      }
    </script>
  </body>
</html>
