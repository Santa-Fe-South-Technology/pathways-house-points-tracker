<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="style.css" />
    <title>Submit Points - House Points Tracker</title>
  </head>
  <body>
    <div class="container">
      <h1>Submit House Points</h1>
      <form id="pointsForm">
        <div class="form-group">
          <label for="house">Select House:</label>
          <select id="house" name="house" required>
            <option value="">Select a house...</option>
            <option value="Ambrosius">Ambrosius</option>
            <option value="Valerius">Valerius</option>
            <option value="Nicostratus">Nicostratus</option>
            <option value="Sapientia">Sapientia</option>
          </select>
        </div>

        <div class="form-group">
          <label for="studentName">Student Name:</label>
          <input type="text" id="studentName" name="studentName" required />
        </div>

        <div class="form-group">
          <label for="points">Points:</label>
          <select id="points" name="points" required>
            <option value="">Select points...</option>
            <option value="-15">-15</option>
            <option value="-10">-10</option>
            <option value="-5">-5</option>
            <option value="1">1</option>
            <option value="5">5</option>
            <option value="10">10</option>
            <option value="15">15</option>
            <option value="25">25</option>
            <option value="50">50</option>
            <option value="75">75</option>
            <option value="100">100</option>
          </select>
        </div>

        <div class="form-group">
          <label for="teacher">Teacher:</label>
          <select id="teacher" name="teacher" required>
            <option value="">Select a teacher...</option>
            <option value="Teacher1">Teacher 1</option>
            <option value="Teacher2">Teacher 2</option>
            <option value="Teacher3">Teacher 3</option>
            <option value="Teacher4">Teacher 4</option>
          </select>
        </div>

        <div class="form-group">
          <label for="reason">Reason:</label>
          <textarea id="reason" name="reason" required></textarea>
        </div>

        <button type="submit">Submit</button>
      </form>
      <div class="navigation">
        <a href="standings.html" class="nav-button">View Standings</a>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
